# nginx — Bot Operativos (Mini Apps: preoperacional y escáner)
#
# operativos.viacotur.com → FastAPI en Docker, 127.0.0.1:8011
#
# DNS (GoDaddy): A operativos → IP pública del servidor (181.205.45.154).
# MikroTik ya hace dst-nat de 80/443 hacia este servidor (mismo camino que bot.viacotur.com).
# TLS: se amplía el certificado existente de bot.viacotur.com (ver docs/DOMINIO_FIJO.md).

server {
    listen 80;
    listen [::]:80;
    server_name operativos.viacotur.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name operativos.viacotur.com;

    ssl_certificate     /etc/letsencrypt/live/bot.viacotur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.viacotur.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # El preoperacional sube la foto de testigos en base64 (hasta ~4 MB); el valor por
    # defecto de nginx (1 MB) la rechazaría con 413.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
