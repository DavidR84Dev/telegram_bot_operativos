<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pos-Operacional</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    /* Identidad VIACOTUR (igual que los demás formularios). */
    --brand: #1b1f5e;
    --brand-2: #1f6fb8;
    --brand-soft: color-mix(in srgb, var(--brand-2) 12%, transparent);
    --bg: var(--tg-theme-secondary-bg-color, #eef2f8);
    --surface: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #14172f);
    --hint: var(--tg-theme-hint-color, #6b7085);
    --line: color-mix(in srgb, var(--hint) 28%, transparent);
    --ok: #1f9d55; --bad: #d64545; --warn: #c27a12;
    --radius: 14px;
    --tap: 44px; /* área táctil mínima */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  header.brand { background: #fff; padding: 12px 16px 8px; text-align: center; border-bottom: 3px solid var(--brand); }
  header.brand img { height: 52px; width: auto; display: block; margin: 0 auto 4px; }
  header.brand h1 { margin: 0; font-size: 17px; color: var(--brand); letter-spacing: .2px; }

  main { padding: 4px 16px 16px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin: 12px 0; box-shadow: 0 1px 2px rgb(0 0 0 / 6%); }
  .card h2 { font-size: 16px; margin: 0 0 4px; color: var(--brand-2); }
  .hint { color: var(--hint); font-size: 13px; }
  label.field { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  .req { color: var(--bad); }
  input[type=text], input[type=date], input[type=datetime-local], select, textarea {
    width: 100%; min-height: var(--tap); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); font: inherit; font-size: 16px;
  }
  textarea { resize: vertical; min-height: 72px; }
  input[readonly] { background: color-mix(in srgb, var(--hint) 10%, var(--surface)); color: var(--fg); opacity: 1; }
  .missing input, .missing select, .missing textarea, input.missing { border-color: var(--bad); }
  .field-wrap { scroll-margin-top: 16px; }
  .field-wrap.flash { animation: flash 1.6s ease-out; border-radius: 10px; }
  @keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--warn) 22%, transparent); } 100% { background: transparent; } }

  /* Soporte */
  .sop-zone {
    display: grid; place-items: center; gap: 8px; border: 2px dashed color-mix(in srgb, var(--brand-2) 55%, transparent);
    border-radius: var(--radius); background: var(--brand-soft); color: var(--brand-2); text-align: center; padding: 14px; margin-top: 8px;
  }
  .sop-zone.missing { border-color: var(--bad); color: var(--bad); }
  .sop-zone .big { font-size: 30px; }
  .camara { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
  .camara[hidden] { display: none; }
  .camara video { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #000; }
  .cam-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px;
             padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .cam-cancel, .cam-spacer { width: 96px; }
  .cam-cancel { min-height: var(--tap); border: 0; border-radius: 10px; background: rgba(255,255,255,.18); color: #fff; font: inherit; }
  .cam-shutter { width: 68px; height: 68px; border-radius: 50%; border: 4px solid #fff;
                 background: color-mix(in srgb, #fff 85%, transparent); padding: 0; }
  .cam-shutter:active { transform: scale(.94); }
  .sop-botones { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .btn-file {
    min-height: var(--tap); border-radius: 10px; border: 1px solid var(--brand-2); background: var(--surface);
    color: var(--brand-2); font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px;
  }
  .sop-ok { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: 10px;
            background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .sop-ok .nombre { flex: 1; overflow-wrap: anywhere; font-weight: 600; }
  .sop-ok img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
  .btn-link { background: none; border: 0; color: var(--brand-2); font: inherit; font-weight: 600; min-height: var(--tap); padding: 0 6px; }

  .banner { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-top: 12px; }
  .banner.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .banner.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .banner.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
  .banner ul { margin: 4px 0 0; padding-left: 18px; }
  .banner button.jump { background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; text-decoration: underline; text-align: left; min-height: 28px; }

  footer.actions {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; z-index: 10;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface);
    box-shadow: 0 -2px 10px rgb(0 0 0 / 8%);
  }
  footer.actions button { flex: 1; min-height: 50px; padding: 12px; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 600; border: 0; }
  .btn-primary { background: var(--ok); color: #fff; }
  .btn-primary:disabled { opacity: .45; }
  .btn-secondary { background: color-mix(in srgb, var(--hint) 16%, transparent); color: var(--fg); flex: 0 0 34% !important; }

  #msg { white-space: pre-line; margin: 10px 0 0; }
  #msg.error { color: var(--bad); font-weight: 600; }
  .center { text-align: center; }
  .state-icon { font-size: 52px; text-align: center; margin: 8px 0; }
  #blocked.warn { border: 2px solid var(--warn); }
  #blocked.warn h2 { color: var(--warn); }
  #done-text, #blocked-text { white-space: pre-line; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="brand">
  <img src="/static/viacotur-logo.png" alt="VIACOTUR S.A. — Transporte especial y de carga">
  <h1>Pos-Operacional</h1>
</header>

<main>
  <p id="msg" class="hint center">Cargando datos…</p>

  <section id="formulario" hidden>
    <div class="card">
      <h2>Información del personal</h2>
      <label class="field" for="conductor">Empleado</label>
      <input id="conductor" type="text" readonly>
      <label class="field" for="contrato">Contrato</label>
      <input id="contrato" type="text" readonly placeholder="Sin contrato">
    </div>

    <div class="card">
      <h2>Vehículo</h2>
      <div class="banner ok" id="vehiculo-ok" hidden>✔ <span id="vehiculo-texto"></span></div>
      <div class="banner warn" id="vehiculo-aviso" hidden>⚠️ <span>No hay vehículo asignado. El pos-operacional se registrará sin vehículo.</span></div>
      <div class="field-wrap" id="w-km-inicial">
        <label class="field" for="km-inicial">KM inicial <span class="req">*</span></label>
        <input id="km-inicial" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        <div class="hint" id="km-inicial-hint"></div>
      </div>
      <div class="field-wrap" id="w-km-final">
        <label class="field" for="km-final">KM final <span class="req">*</span></label>
        <input id="km-final" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        <div class="hint" id="km-recorrido"></div>
      </div>
    </div>

    <div class="card">
      <h2>Fechas y horarios</h2>
      <div class="hint">Hora de Colombia.</div>
      <div class="field-wrap" id="w-entrada">
        <label class="field" for="entrada">Entrada <span class="req">*</span></label>
        <input id="entrada" type="datetime-local">
      </div>
      <div class="field-wrap" id="w-salida">
        <label class="field" for="salida">Salida <span class="req">*</span></label>
        <input id="salida" type="datetime-local">
        <div class="hint" id="duracion"></div>
      </div>
    </div>

    <div class="card">
      <h2>Planilla de servicios</h2>
      <div class="field-wrap" id="w-planilla">
        <label class="field">Planilla (PDF o foto) <span class="req">*</span></label>
        <div class="sop-zone" id="planilla-zona">
          <span class="big">🧾</span>
          <div class="sop-botones">
            <button type="button" class="btn-file" id="btn-camara">📷 Tomar foto</button>
            <button type="button" class="btn-file" id="btn-archivo">🖼️ Galería o PDF</button>
          </div>
          <span class="hint" id="planilla-hint"></span>
        </div>
        <div class="sop-ok" id="planilla-ok" hidden></div>
        <input type="file" id="in-camara" accept="image/*" capture="environment" hidden>
        <input type="file" id="in-archivo" accept="application/pdf,.pdf,image/*" hidden>
      </div>
    </div>

    <div class="card">
      <h2>Observaciones</h2>
      <div class="field-wrap" id="w-obs">
        <label class="field" for="obs">Observaciones (opcional)</label>
        <textarea id="obs" rows="3" placeholder="Opcional"></textarea>
      </div>
    </div>
  </section>

  <div id="pendientes" class="banner bad" hidden></div>

  <section id="blocked" class="card" hidden>
    <div class="state-icon" id="blocked-icon">🚫</div>
    <h2 class="center" id="blocked-title"></h2>
    <p class="hint center" id="blocked-text"></p>
  </section>

  <section id="done" class="card" hidden>
    <div class="state-icon">✅</div>
    <h2 class="center" id="done-title"></h2>
    <p class="hint center" id="done-text"></p>
  </section>
</main>

<div id="camara" class="camara" hidden>
  <video id="cam-video" autoplay playsinline muted></video>
  <div class="cam-bar">
    <button type="button" class="cam-cancel" id="cam-cerrar">Cancelar</button>
    <button type="button" class="cam-shutter" id="cam-capturar" aria-label="Capturar foto"></button>
    <span class="cam-spacer"></span>
  </div>
</div>

<footer class="actions" id="actions" hidden>
  <button type="button" class="btn-secondary" id="cancelar">Cancelar</button>
  <button type="button" class="btn-primary" id="enviar">Enviar</button>
</footer>

<script>
(() => {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, children = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "text") n.textContent = v;
      else if (k === "class") n.className = v;
      else n.setAttribute(k, v);
    }
    for (const c of children) n.append(c);
    return n;
  };

  const FOTO_LADO_MAX = 1800;   // px del lado mayor al reducir una foto
  const state = {
    form: null, ctx: null, planilla: null,
    uuid: null, sending: false, finished: false, dirty: false,
    initDataOriginal: "", pendiente: null, pendienteGuardado: false, reintento: null, avisoBandeja: "",
  };

  function setMsg(text, isError = false) {
    $("msg").textContent = text;
    $("msg").className = isError ? "error" : "hint center";
    $("msg").hidden = !text;
  }

  function markDirty() {
    if (!state.dirty && tg && tg.enableClosingConfirmation) tg.enableClosingConfirmation();
    state.dirty = true;
  }

  function newUuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }

  // ── Números: punto decimal (docs/GUIA_NUEVOS_BOTS.md § 1) ──
  // El teclado en español escribe coma: se cambia por punto en el mismo campo y queda un solo separador.
  function normalizarDecimal(input) {
    const antes = input.value;
    let v = antes.replace(/,/g, ".").replace(/[^\d.]/g, "");
    const punto = v.indexOf(".");
    if (punto !== -1) v = v.slice(0, punto + 1) + v.slice(punto + 1).replace(/\./g, "");
    if (v === antes) return;
    const cursor = Math.max(0, (input.selectionStart ?? v.length) - (antes.length - v.length));
    input.value = v;
    try { input.setSelectionRange(cursor, cursor); } catch { /* algunos navegadores no lo permiten */ }
  }
  // Vacío o inválido -> NaN.
  function parseNum(texto) {
    const t = String(texto).replace(/,/g, ".").trim();
    return t === "" ? NaN : Number(t);
  }
  // Miles con espacio y punto decimal (el formato local es-CO usa coma decimal).
  function fmtNum(n, dec = 0) {
    if (!Number.isFinite(n)) return "—";
    const [ent, frac] = n.toFixed(dec).split(".");
    const miles = ent.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return frac && Number(frac) !== 0 ? `${miles}.${frac}` : miles;
  }

  // Fechas: los campos están en hora de Colombia («YYYY-MM-DDTHH:MM») y así viajan; el servidor las pasa a UTC.
  // Solo se comparan entre sí, así que se leen todas como UTC para restar sin depender de la zona del teléfono.
  const msDe = (valor) => (valor ? Date.parse(`${valor}:00Z`) : NaN);

  // Sin respuesta del servidor (sin señal) o el túnel/proxy no llega al bot: se puede reintentar.
  const SIN_RED = [502, 503, 504];

  async function api(path, options = {}) {
    let res;
    try {
      res = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg ? tg.initData : "", ...(options.headers || {}) },
      });
    } catch (_) {
      const err = new Error("Sin conexión");
      err.network = true;
      throw err;
    }
    if (SIN_RED.includes(res.status)) {
      const err = new Error(`Error ${res.status}`);
      err.status = res.status;
      err.network = true;
      throw err;
    }
    let body = null;
    try { body = await res.json(); } catch (_) { /* sin JSON */ }
    if (!res.ok) {
      let detail = body && body.detail;
      if (Array.isArray(detail)) detail = detail.map((d) => String(d.msg).replace(/^Value error, /, "")).join("\n");
      const err = new Error(detail || `Error ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return body;
  }

  // ── Bandeja de salida (formularios guardados sin señal) ─────────────────
  // Regla de todos los formularios (docs/GUIA_NUEVOS_BOTS.md § 5): sin señal, el envío (con su
  // planilla) se guarda en el teléfono y se reenvía solo al volver la red, como máximo 1 hora
  // después de perderla. Pasada la hora el servidor lo guarda solo como auditoría (410).
  const VENTANA_MS = 60 * 60 * 1000;
  const REINTENTO_MS = 15 * 1000;
  const BANDEJA_MAX_MS = 7 * 24 * 60 * 60 * 1000;
  const IDB_NAME = "pos-operacional-offline", IDB_STORE = "bandeja", LS_PREFIX = "pos-operacional-bandeja:";

  function idb() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("sin IndexedDB")); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE, { keyPath: "uuid" });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbRun(mode, fn) {
    const db = await idb();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, mode);
        const req = fn(tx.objectStore(IDB_STORE));
        tx.oncomplete = () => resolve(req && req.result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    } finally { db.close(); }
  }

  const bandeja = {
    async put(item) {
      try { await idbRun("readwrite", (s) => s.put(item)); return true; } catch (_) { /* respaldo */ }
      try { localStorage.setItem(LS_PREFIX + item.uuid, JSON.stringify(item)); return true; } catch (_) { return false; }
    },
    async all() {
      let items = [];
      try { items = (await idbRun("readonly", (s) => s.getAll())) || []; } catch (_) { /* respaldo */ }
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(LS_PREFIX) && !items.some((x) => LS_PREFIX + x.uuid === k)) items.push(JSON.parse(localStorage.getItem(k)));
        }
      } catch (_) { /* sin almacenamiento */ }
      return items;
    },
    async del(uuid) {
      try { await idbRun("readwrite", (s) => s.delete(uuid)); } catch (_) { /* respaldo */ }
      try { localStorage.removeItem(LS_PREFIX + uuid); } catch (_) { /* sin almacenamiento */ }
    },
  };

  const usuarioId = () => (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null);
  const vencidoLocal = (item) => Date.now() - Date.parse(item.sin_senal_desde) > VENTANA_MS;
  const cuerpoDiferido = (item) => JSON.stringify({
    ...item.payload, diferido: { init_data_original: item.init_data_original, sin_senal_desde: item.sin_senal_desde },
  });

  async function vaciarBandeja() {
    const propios = (await bandeja.all()).filter((i) => i && i.user_id === usuarioId())
      .sort((a, b) => Date.parse(a.sin_senal_desde) - Date.parse(b.sin_senal_desde));
    let aceptado = null, aviso = "";
    for (const item of propios) {
      if (Date.now() - Date.parse(item.sin_senal_desde) > BANDEJA_MAX_MS) { await bandeja.del(item.uuid); continue; }
      try {
        aceptado = await api("/api/pos-operacional", { method: "POST", body: cuerpoDiferido(item) });
        await bandeja.del(item.uuid);
      } catch (err) {
        if (err.network || err.status === 401 || (err.status && err.status >= 500)) break;
        await bandeja.del(item.uuid);
        if (err.status !== 410) aviso = `Tu pos-operacional guardado sin señal no fue aceptado: ${err.message}\nDiligéncialo de nuevo.`;
      }
    }
    return { aceptado, aviso };
  }

  function detenerReintentos() {
    if (state.reintento) { clearInterval(state.reintento); state.reintento = null; }
    window.removeEventListener("online", reintentarSiPendiente);
  }

  function reintentarSiPendiente() {
    if (!state.pendiente || state.sending || state.finished) return;
    if (vencidoLocal(state.pendiente)) { vencer(); return; }
    submit();
  }

  function modoSinSenal(guardado) {
    $("enviar").textContent = "Reintentar ahora";
    $("enviar").disabled = false;
    setMsg(guardado
      ? "📥 Sin señal. Tu pos-operacional quedó guardado en este teléfono y se enviará solo cuando vuelva la señal (hasta 1 hora).\n" +
        "Mantén abierto el formulario; si lo cierras, vuelve a abrirlo cuando tengas señal."
      : "📵 Sin señal y no se pudo guardar en el teléfono. No cierres el formulario: se enviará solo cuando vuelva la señal (hasta 1 hora).",
    true);
    if (!state.reintento) {
      state.reintento = setInterval(reintentarSiPendiente, REINTENTO_MS);
      window.addEventListener("online", reintentarSiPendiente);
    }
  }

  function vencer() {
    detenerReintentos();
    state.finished = true;
    if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
    $("formulario").hidden = true;
    $("pendientes").hidden = true;
    $("actions").hidden = true;
    block("No se pudo enviar a tiempo",
      "Pasó más de 1 hora sin señal y este envío ya no se puede registrar.\nDiligencia el pos-operacional de nuevo cuando tengas señal.");
  }

  function confirmAsync(text) {
    return new Promise((resolve) => {
      if (tg && tg.showConfirm) tg.showConfirm(text, (ok) => resolve(Boolean(ok)));
      else resolve(window.confirm(text));
    });
  }

  // ── Planilla: PDF tal cual; foto reducida y vuelta a JPG (Odoo recibe el JPG, sin convertir a PDF) ──
  function leerDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error("No se pudo leer el archivo."));
      r.readAsDataURL(blob);
    });
  }

  async function esPdf(file) {
    const cabecera = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    return String.fromCharCode(...cabecera) === "%PDF";
  }

  async function decodificarImagen(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file); } catch (_) { /* se prueba con <img> */ }
    }
    const url = URL.createObjectURL(file);
    try {
      return await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("imagen no legible"));
        img.src = url;
      });
    } finally { URL.revokeObjectURL(url); }
  }

  function aBlobJpg(canvas, calidad) {
    return new Promise((resolve) => canvas.toBlob((b) => resolve(b), "image/jpeg", calidad));
  }

  async function fotoAJpg(file) {
    const img = await decodificarImagen(file);
    const ancho = img.naturalWidth || img.width, alto = img.naturalHeight || img.height;
    let escala = Math.min(1, FOTO_LADO_MAX / Math.max(ancho, alto));
    for (let intento = 0; intento < 4; intento++) {
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(ancho * escala));
      canvas.height = Math.max(1, Math.round(alto * escala));
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";  // PNG con transparencia: fondo blanco
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await aBlobJpg(canvas, 0.8);
      if (!blob) throw new Error("no se pudo procesar la foto");
      if (blob.size <= state.form.planilla_max_bytes) return blob;
      escala *= 0.7;
    }
    throw new Error("la foto sigue siendo demasiado pesada");
  }

  async function onPlanilla(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    const maxMb = Math.round(state.form.planilla_max_bytes / 1048576);
    try {
      let blob, nombre = file.name || "planilla", vista = null;
      if (await esPdf(file)) {
        if (file.size > state.form.planilla_max_bytes) { setMsg(`El PDF pesa ${fmtNum(file.size / 1048576, 1)} MB; el máximo es ${maxMb} MB.`, true); return; }
        blob = file;
      } else if (file.type.startsWith("image/") || /\.(jpe?g|png|heic|heif|webp)$/i.test(nombre)) {
        try { blob = await fotoAJpg(file); } catch (_) {
          setMsg("No se pudo leer la foto. Toma otra, o usa una imagen JPG o PNG o un PDF.", true);
          return;
        }
        nombre = nombre.replace(/\.[A-Za-z0-9]{1,5}$/, "") + ".jpg";
        vista = URL.createObjectURL(blob);
      } else {
        setMsg("La planilla debe ser un PDF o una foto (JPG o PNG).", true);
        return;
      }
      if (state.planilla && state.planilla.vista) URL.revokeObjectURL(state.planilla.vista);
      state.planilla = { nombre, bytes: blob.size, data: await leerDataUrl(blob), vista };
    } catch (err) {
      setMsg(err.message, true);
      return;
    }
    markDirty();
    setMsg("");
    renderPlanilla();
  }

  // Telegram en Android ignora <input capture> y abre la galería: la cámara se abre aquí mismo con
  // getUserMedia (cámara trasera), igual que en el Preoperacional. Sin permiso o soporte se usa el input.
  const camara = { stream: null };

  async function abrirCamara(input) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { input.click(); return; }
    try {
      camara.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
      });
    } catch (err) {
      setMsg(err && err.name === "NotAllowedError"
        ? "Permite el acceso a la cámara a Telegram para tomar la foto, o adjunta la planilla con 🖼️ Galería o PDF."
        : "No se pudo abrir la cámara. Adjunta la foto o el PDF con 🖼️ Galería o PDF.", true);
      return;
    }
    const video = document.getElementById("cam-video");
    video.srcObject = camara.stream;
    document.getElementById("camara").hidden = false;
    try { await video.play(); } catch (_) { /* se reproduce al tocar */ }
  }

  function cerrarCamara() {
    if (camara.stream) camara.stream.getTracks().forEach((t) => t.stop());
    camara.stream = null;
    document.getElementById("cam-video").srcObject = null;
    document.getElementById("camara").hidden = true;
  }

  function capturarFoto() {
    const video = document.getElementById("cam-video");
    if (!video.videoWidth) return;  // aún no hay imagen
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    cerrarCamara();
    canvas.toBlob((blob) => {
      if (!blob) { setMsg("No se pudo tomar la foto. Intenta de nuevo.", true); return; }
      const file = new File([blob], `planilla_${Date.now()}.jpg`, { type: "image/jpeg" });
      onPlanilla({ target: { files: [file], value: "" } });
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    }, "image/jpeg", 0.9);
  }

  document.getElementById("cam-cerrar").addEventListener("click", cerrarCamara);
  document.getElementById("cam-capturar").addEventListener("click", capturarFoto);

  function renderPlanilla() {
    const p = state.planilla;
    $("planilla-zona").hidden = Boolean(p);
    $("planilla-ok").hidden = !p;
    if (p) {
      const miniatura = p.vista ? el("img", { alt: "Vista previa de la planilla" }) : el("span", { text: "📄" });
      if (p.vista) miniatura.src = p.vista;
      $("planilla-ok").replaceChildren(miniatura, el("span", { class: "nombre", text: `${p.nombre} (${fmtNum(p.bytes / 1024, 0)} KB)` }));
      const quitar = el("button", { type: "button", class: "btn-link", text: "Quitar" });
      quitar.addEventListener("click", () => {
        if (p.vista) URL.revokeObjectURL(p.vista);
        state.planilla = null; markDirty(); renderPlanilla();
      });
      $("planilla-ok").append(quitar);
    }
    if (!$("pendientes").hidden) renderPendientes();
  }

  // ── Resumen en vivo: kilómetros recorridos y duración ────────────────────
  function refrescar() {
    const ini = parseNum($("km-inicial").value), fin = parseNum($("km-final").value);
    $("km-recorrido").textContent = Number.isFinite(ini) && Number.isFinite(fin) && fin >= ini
      ? `Recorrido: ${fmtNum(fin - ini, 1)} km` : "";
    const e = msDe($("entrada").value), s = msDe($("salida").value);
    if (Number.isFinite(e) && Number.isFinite(s) && s > e) {
      const min = Math.round((s - e) / 60000);
      $("duracion").textContent = `Duración: ${Math.floor(min / 60)} h ${String(min % 60).padStart(2, "0")} min`;
    } else {
      $("duracion").textContent = "";
    }
    if (!$("pendientes").hidden) renderPendientes();
  }

  // ── Pendientes (cada uno lleva a su campo) ───────────────────────────────
  function pendientes() {
    const out = [];
    const add = (id, text) => out.push({ id, text });
    const ini = parseNum($("km-inicial").value), fin = parseNum($("km-final").value);
    const max = state.form.km_max;
    if (!Number.isFinite(ini)) add("w-km-inicial", "KM inicial");
    else if (ini < 0 || ini > max) add("w-km-inicial", "KM inicial (fuera de rango)");
    if (!Number.isFinite(fin)) add("w-km-final", "KM final");
    else if (fin < 0 || fin > max) add("w-km-final", "KM final (fuera de rango)");
    else if (Number.isFinite(ini) && fin < ini) add("w-km-final", "KM final (no puede ser menor que el KM inicial)");
    const e = msDe($("entrada").value), s = msDe($("salida").value);
    if (!Number.isFinite(e)) add("w-entrada", "Entrada (fecha y hora)");
    if (!Number.isFinite(s)) add("w-salida", "Salida (fecha y hora)");
    if (Number.isFinite(e) && Number.isFinite(s)) {
      if (s <= e) add("w-salida", "Salida (debe ser posterior a la entrada)");
      else if (s - e > state.form.rango_max_horas * 3600000) add("w-salida", `Salida (máximo ${state.form.rango_max_horas} horas después de la entrada)`);
    }
    if (!state.planilla) add("w-planilla", "Planilla de servicios (PDF o foto)");
    return out;
  }

  function renderPendientes(show = true) {
    const faltan = pendientes();
    const ids = new Set(faltan.map((f) => f.id));
    document.querySelectorAll(".field-wrap").forEach((w) => w.classList.toggle("missing", show && ids.has(w.id)));
    $("planilla-zona").classList.toggle("missing", show && ids.has("w-planilla"));
    const box = $("pendientes");
    box.hidden = !show || faltan.length === 0;
    if (box.hidden) return;
    box.replaceChildren(el("div", {}, [
      el("strong", { text: `Falta completar (${faltan.length}):` }),
      el("ul", {}, faltan.map((f) => {
        const b = el("button", { type: "button", class: "jump", text: f.text });
        b.addEventListener("click", () => jump(f.id));
        return el("li", {}, [b]);
      })),
    ]));
  }

  function jump(id) {
    const w = $(id);
    w.scrollIntoView({ behavior: "smooth", block: "center" });
    w.classList.remove("flash"); void w.offsetWidth; w.classList.add("flash");
  }

  // ── Envío ────────────────────────────────────────────────────────────────
  async function enviar() {
    if (state.finished) { tg.close(); return; }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (state.pendiente) { submit(); return; }
    if (pendientes().length) {
      renderPendientes(true);
      $("pendientes").scrollIntoView({ behavior: "smooth", block: "center" });
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      return;
    }
    const recorrido = parseNum($("km-final").value) - parseNum($("km-inicial").value);
    if (!(await confirmAsync(`¿Confirmas el envío del pos-operacional (${fmtNum(recorrido, 1)} km recorridos)?`))) return;
    await submit();
  }

  async function cancelar() {
    if (state.finished || !state.dirty || (await confirmAsync("¿Cancelar y descartar lo que llenaste?"))) {
      if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
      tg.close();
    }
  }

  async function submit() {
    if (state.sending) return;
    state.sending = true;
    $("enviar").disabled = true;
    $("enviar").textContent = "Enviando…";
    const payload = state.pendiente ? state.pendiente.payload : {
      uuid: state.uuid,
      km_inicial: parseNum($("km-inicial").value),
      km_final: parseNum($("km-final").value),
      entrada: $("entrada").value,
      salida: $("salida").value,
      planilla: state.planilla.data,
      planilla_nombre: state.planilla.nombre,
      observaciones: $("obs").value.trim() || null,
    };
    try {
      const body = state.pendiente ? cuerpoDiferido(state.pendiente) : JSON.stringify(payload);
      const out = await api("/api/pos-operacional", { method: "POST", body });
      if (state.pendiente) { detenerReintentos(); await bandeja.del(state.uuid); }
      showDone(out, Boolean(state.pendiente));
    } catch (err) {
      state.sending = false;
      if (err.network) {
        if (!state.pendiente) {
          state.pendiente = {
            uuid: state.uuid, user_id: usuarioId(), payload,
            init_data_original: state.initDataOriginal, sin_senal_desde: new Date().toISOString(),
          };
          state.pendienteGuardado = await bandeja.put(state.pendiente);
        }
        if (vencidoLocal(state.pendiente)) vencer(); else modoSinSenal(state.pendienteGuardado);
        return;
      }
      if (err.status === 410) { await bandeja.del(state.uuid); vencer(); return; }
      detenerReintentos();
      const sesion = err.status === 401 ? "\nCierra y vuelve a abrir el formulario: lo que guardaste se enviará al abrirlo." : "";
      setMsg(`No se pudo enviar: ${err.message}${sesion}\nPuedes corregir y reintentar: no se duplicará.`, true);
      $("enviar").textContent = "Reintentar envío";
      $("enviar").disabled = false;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    }
  }

  function showDone(out, diferido = false) {
    state.finished = true;
    if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
    $("formulario").hidden = true;
    $("pendientes").hidden = true;
    $("actions").hidden = false;
    $("cancelar").hidden = true;
    $("enviar").textContent = "Cerrar";
    $("enviar").disabled = false;
    setMsg("");
    $("done").hidden = false;
    $("done-title").textContent = out.duplicado ? "Este pos-operacional ya había sido recibido"
      : diferido ? "Pos-operacional recibido al recuperar la señal" : "Pos-operacional recibido";
    $("done-text").textContent = "Se está registrando en Odoo y recibirás el resultado en el chat.\n" +
      "Enviarlo no libera tu vehículo: cuando termines tu jornada toca 🔴 Finalizar en el chat.";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  }

  function block(title, text, aviso = false) {
    $("blocked").hidden = false;
    $("blocked").classList.toggle("warn", aviso);
    $("blocked-icon").textContent = aviso ? "⚠️" : "🚫";
    $("blocked-title").textContent = title;
    $("blocked-text").textContent = text;
    setMsg("");
  }

  // ── Arranque ─────────────────────────────────────────────────────────────
  async function init() {
    if (!tg || !tg.initData) {
      block("Abre el formulario desde Telegram", "Usa el botón «📋 Formularios» del bot y elige «🧾 Pos-Operacional».");
      return;
    }
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor("#ffffff"); } catch (_) { /* versión antigua */ } }
    // Antes de vaciar la bandeja: si se acepta un envío guardado, el botón "Cerrar" debe funcionar.
    $("enviar").addEventListener("click", enviar);
    $("cancelar").addEventListener("click", cancelar);
    try {
      const [form, ctx] = await Promise.all([api("/api/pos-operacional/form"), api("/api/pos-operacional/context")]);
      state.form = form;
      state.ctx = ctx;
      const previo = await vaciarBandeja();
      if (previo.aceptado) { showDone(previo.aceptado, true); return; }
      state.avisoBandeja = previo.aviso;
    } catch (err) {
      if (err.status === 403) block("Usuario no registrado", `${err.message}.\nPide a Recursos Humanos que lo registre.`);
      else block("No se pudo cargar el formulario", `${err.message}\nVerifica tu señal y vuelve a abrirlo.`);
      return;
    }
    state.uuid = newUuid();
    state.initDataOriginal = tg.initData;
    const c = state.ctx;
    $("conductor").value = c.empleado.nombre;
    $("contrato").value = c.contrato ? (c.contrato.nombre || `Contrato ${c.contrato.id}`) : "";
    // Sin vehículo reservado no se bloquea: el pos-operacional se registra sin vehículo.
    const v = c.vehiculo;
    $("vehiculo-ok").hidden = !v;
    $("vehiculo-aviso").hidden = Boolean(v);
    if (v) $("vehiculo-texto").textContent = `Vehículo asignado: ${[v.placa, v.numero_interno && `N.º interno ${v.numero_interno}`].filter(Boolean).join(" · ")}`;
    if (c.km_inicial !== null && c.km_inicial !== undefined) {
      $("km-inicial").value = String(c.km_inicial);
      $("km-inicial-hint").textContent = "Odómetro de tu último preoperacional de la jornada; puedes corregirlo.";
    }
    $("entrada").value = c.entrada || "";
    $("salida").value = c.salida || "";
    $("planilla-hint").textContent = `PDF o foto, máximo ${Math.round(state.form.planilla_max_bytes / 1048576)} MB`;
    $("obs").maxLength = state.form.observacion_max;

    for (const id of ["km-inicial", "km-final"]) {
      $(id).addEventListener("input", () => { normalizarDecimal($(id)); markDirty(); refrescar(); });
    }
    for (const id of ["entrada", "salida"]) $(id).addEventListener("input", () => { markDirty(); refrescar(); });
    $("obs").addEventListener("input", markDirty);
    $("btn-camara").addEventListener("click", () => abrirCamara($("in-camara")));
    $("btn-archivo").addEventListener("click", () => $("in-archivo").click());
    $("in-camara").addEventListener("change", onPlanilla);
    $("in-archivo").addEventListener("change", onPlanilla);

    $("formulario").hidden = false;
    $("actions").hidden = false;
    refrescar();
    setMsg(state.avisoBandeja, true);
  }

  init();
})();
</script>
</body>
</html>
