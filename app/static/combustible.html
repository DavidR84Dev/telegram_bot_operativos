<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Combustible</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    /* Identidad VIACOTUR (igual que el preoperacional, el AST y la Prueba de Ruta). */
    --brand: #1b1f5e;
    --brand-2: #1f6fb8;
    --brand-soft: color-mix(in srgb, var(--brand-2) 12%, transparent);
    --bg: var(--tg-theme-secondary-bg-color, #eef2f8);
    --surface: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #14172f);
    --hint: var(--tg-theme-hint-color, #6b7085);
    --line: color-mix(in srgb, var(--hint) 28%, transparent);
    --ok: #1f9d55; --bad: #d64545; --warn: #c27a12;
    --radius: 14px;
    --tap: 44px; /* área táctil mínima */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  header.brand { background: #fff; padding: 12px 16px 8px; text-align: center; border-bottom: 3px solid var(--brand); }
  header.brand img { height: 52px; width: auto; display: block; margin: 0 auto 4px; }
  header.brand h1 { margin: 0; font-size: 17px; color: var(--brand); letter-spacing: .2px; }

  /* Barra de progreso (2 pasos) */
  .stepper { display: grid; grid-template-columns: repeat(2, 1fr); padding: 12px 4px 2px; position: relative; }
  .stepper::before { content: ""; position: absolute; left: 25%; right: 25%; top: 25px; height: 3px; background: var(--line); }
  .stepper .bar { position: absolute; left: 25%; top: 25px; height: 3px; width: 0; background: var(--brand-2); transition: width .25s; }
  .step { position: relative; text-align: center; font-size: 12px; color: var(--hint); white-space: nowrap; }
  .step .dot {
    width: 28px; height: 28px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); border: 3px solid var(--line); font-weight: 700; font-size: 13px; color: var(--hint); position: relative; z-index: 1;
  }
  .step.active .dot { border-color: var(--brand-2); color: var(--brand-2); }
  .step.done .dot { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
  .step.active, .step.done { color: var(--fg); font-weight: 600; }

  main { padding: 4px 16px 16px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin: 12px 0; box-shadow: 0 1px 2px rgb(0 0 0 / 6%); }
  .card h2 { font-size: 16px; margin: 0 0 4px; color: var(--brand-2); }
  .hint { color: var(--hint); font-size: 13px; }
  label.field { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  .req { color: var(--bad); }
  input[type=text], input[type=date], select {
    width: 100%; min-height: var(--tap); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); font: inherit; font-size: 16px;
  }
  input[readonly] { background: color-mix(in srgb, var(--hint) 10%, var(--surface)); color: var(--fg); opacity: 1; }
  .missing input, .missing select, input.missing { border-color: var(--bad); }
  .field-wrap { scroll-margin-top: 16px; }
  .field-wrap.flash { animation: flash 1.6s ease-out; border-radius: 10px; }
  @keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--warn) 22%, transparent); } 100% { background: transparent; } }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .total { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--brand-soft); display: flex; justify-content: space-between; font-weight: 600; }
  .total strong { color: var(--brand-2); font-size: 17px; }

  /* Pestañas Combustible / Combustible para gastos */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .tabs button {
    min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg); font: inherit; font-size: 14px; padding: 6px;
  }
  .tabs button[aria-pressed="true"] { background: var(--brand-2); border-color: var(--brand-2); color: #fff; font-weight: 600; }

  /* Buscador de proveedor */
  .sugerencias { display: grid; gap: 4px; margin-top: 6px; max-height: 260px; overflow-y: auto; }
  .sugerencias button {
    min-height: var(--tap); text-align: left; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); font: inherit; font-size: 15px;
  }
  .sugerencias button.libre { border-style: dashed; color: var(--brand-2); }
  .elegido { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 10px 12px; border-radius: 10px;
             background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .elegido .nombre { flex: 1; font-weight: 600; overflow-wrap: anywhere; }
  .elegido .tag { font-size: 12px; color: var(--hint); display: block; font-weight: 400; }
  .btn-link { background: none; border: 0; color: var(--brand-2); font: inherit; font-weight: 600; min-height: var(--tap); padding: 0 6px; }

  /* Factura PDF */
  .pdf-zone {
    display: grid; place-items: center; gap: 6px; min-height: 120px; border: 2px dashed color-mix(in srgb, var(--brand-2) 55%, transparent);
    border-radius: var(--radius); background: var(--brand-soft); color: var(--brand-2); text-align: center; padding: 16px; margin-top: 8px;
  }
  .pdf-zone.missing { border-color: var(--bad); color: var(--bad); }
  .pdf-zone .big { font-size: 34px; }
  .btn-file {
    min-height: var(--tap); border-radius: 10px; border: 1px solid var(--brand-2); background: var(--surface);
    color: var(--brand-2); font: inherit; font-size: 14px; font-weight: 600; padding: 6px 16px;
  }
  .pdf-ok { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: 10px;
            background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .pdf-ok .nombre { flex: 1; overflow-wrap: anywhere; font-weight: 600; }

  .banner { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-top: 12px; }
  .banner.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .banner.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .banner.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
  .banner ul { margin: 4px 0 0; padding-left: 18px; }
  .banner button.jump { background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; text-decoration: underline; text-align: left; min-height: 28px; }

  /* Resumen */
  dl.summary { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 8px 0 0; font-size: 14px; }
  dl.summary dt { color: var(--hint); }
  dl.summary dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

  footer.actions {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; z-index: 10;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface);
    box-shadow: 0 -2px 10px rgb(0 0 0 / 8%);
  }
  footer.actions button { flex: 1; min-height: 50px; padding: 12px; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 600; border: 0; }
  .btn-primary { background: var(--brand-2); color: #fff; }
  .btn-primary.finish { background: var(--ok); }
  .btn-primary:disabled { opacity: .45; }
  .btn-secondary { background: color-mix(in srgb, var(--hint) 16%, transparent); color: var(--fg); flex: 0 0 34% !important; }

  #msg { white-space: pre-line; margin: 10px 0 0; }
  #msg.error { color: var(--bad); font-weight: 600; }
  .center { text-align: center; }
  .state-icon { font-size: 52px; text-align: center; margin: 8px 0; }
  #blocked.warn { border: 2px solid var(--warn); }
  #blocked.warn h2 { color: var(--warn); }
  #done-text, #blocked-text { white-space: pre-line; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="brand">
  <img src="/static/viacotur-logo.png" alt="VIACOTUR S.A. — Transporte especial y de carga">
  <h1>Registro de Combustible</h1>
</header>
<nav class="stepper" id="stepper" aria-label="Progreso" hidden>
  <div class="bar" id="bar"></div>
  <div class="step" data-n="1"><div class="dot">1</div>Registro</div>
  <div class="step" data-n="2"><div class="dot">2</div>Resumen</div>
</nav>

<main>
  <p id="msg" class="hint center">Cargando datos…</p>

  <!-- Paso 1: Registro -->
  <section data-step="1" hidden>
    <div class="card">
      <h2>Información general</h2>
      <label class="field" for="comprador">Comprador</label>
      <input id="comprador" type="text" readonly>
      <label class="field" for="contrato">Contrato</label>
      <input id="contrato" type="text" readonly>
      <label class="field" for="vehiculo">Vehículo</label>
      <input id="vehiculo" type="text" readonly>
      <div class="banner ok">✔ <span>Vehículo reservado con tu preoperacional de la jornada</span></div>
    </div>

    <div class="card">
      <h2>Proveedor</h2>
      <div class="tabs" id="tabs" role="group" aria-label="Tipo de compra"></div>
      <div class="hint" id="tab-hint"></div>
      <div class="field-wrap" id="w-proveedor">
        <label class="field" for="buscar">Proveedor <span class="req">*</span></label>
        <div id="buscador">
          <input id="buscar" type="text" autocomplete="off" maxlength="255" placeholder="Buscar o escribir proveedor…">
          <div class="sugerencias" id="sugerencias"></div>
        </div>
        <div class="elegido" id="elegido" hidden>
          <span class="nombre" id="elegido-nombre"></span>
          <button type="button" class="btn-link" id="cambiar-proveedor">Cambiar</button>
        </div>
      </div>
      <div class="field-wrap" id="w-fecha">
        <label class="field" for="fecha">Fecha de la transacción <span class="req">*</span></label>
        <input id="fecha" type="date">
      </div>
    </div>

    <div class="card">
      <h2>Detalles del combustible</h2>
      <div class="grid2">
        <div class="field-wrap" id="w-galones">
          <label class="field" for="galones">Galones <span class="req">*</span></label>
          <input id="galones" type="text" inputmode="decimal" autocomplete="off" placeholder="12.50">
        </div>
        <div class="field-wrap" id="w-precio">
          <label class="field" for="precio">Precio por galón <span class="req">*</span></label>
          <input id="precio" type="text" inputmode="decimal" autocomplete="off" placeholder="12000">
        </div>
      </div>
      <div class="total"><span>Total</span><strong id="total">$ 0</strong></div>
      <div class="field-wrap" id="w-tipo">
        <label class="field" for="tipo">Tipo de combustible <span class="req">*</span></label>
        <select id="tipo"></select>
      </div>
    </div>

    <div class="card">
      <h2>Referencias y documentos</h2>
      <div class="field-wrap" id="w-km">
        <label class="field" for="km">Kilometraje al tanqueo <span class="req">*</span></label>
        <input id="km" type="text" inputmode="numeric" autocomplete="off">
        <div class="hint" id="km-hint"></div>
      </div>
      <label class="field" for="ref">Referencia de la factura</label>
      <input id="ref" type="text" maxlength="128" autocomplete="off" placeholder="Opcional">
      <div class="field-wrap" id="w-factura">
        <label class="field">Factura (PDF) <span class="req" id="factura-req">*</span></label>
        <div class="hint" id="factura-hint"></div>
        <div class="pdf-zone" id="pdf-zone">
          <span class="big">📄</span>
          <button type="button" class="btn-file" id="elegir-pdf">Adjuntar factura PDF</button>
          <span class="hint">Solo PDF, máximo 4 MB</span>
        </div>
        <div class="pdf-ok" id="pdf-ok" hidden>
          <span>📄</span><span class="nombre" id="pdf-nombre"></span>
          <button type="button" class="btn-link" id="quitar-pdf">Quitar</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Paso 2: Resumen -->
  <section data-step="2" hidden>
    <div class="card"><h2>Información general</h2><dl class="summary" id="sum-general"></dl></div>
    <div class="card"><h2>Compra</h2><dl class="summary" id="sum-compra"></dl></div>
  </section>

  <div id="pendientes" class="banner bad" hidden></div>

  <section id="blocked" class="card" hidden>
    <div class="state-icon" id="blocked-icon">🚫</div>
    <h2 class="center" id="blocked-title"></h2>
    <p class="hint center" id="blocked-text"></p>
  </section>

  <section id="done" class="card" hidden>
    <div class="state-icon">✅</div>
    <h2 class="center" id="done-title"></h2>
    <p class="hint center" id="done-text"></p>
  </section>
</main>

<input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden>

<footer class="actions" id="actions" hidden>
  <button type="button" class="btn-secondary" id="prev">← Atrás</button>
  <button type="button" class="btn-primary" id="next">Siguiente →</button>
</footer>

<script>
(() => {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, children = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "text") n.textContent = v;
      else if (k === "class") n.className = v;
      else n.setAttribute(k, v);
    }
    for (const c of children) n.append(c);
    return n;
  };

  const STEPS = 2;
  const PDF_MAX = 4 * 1024 * 1024;
  const MAX_SUGERENCIAS = 8;
  const state = {
    step: 1, form: null, ctx: null, modalidad: "combustible", proveedor: null, factura: null,
    uuid: null, sending: false, finished: false, dirty: false,
    initDataOriginal: "", pendiente: null, pendienteGuardado: false, reintento: null, avisoBandeja: "",
  };

  function setMsg(text, isError = false) {
    $("msg").textContent = text;
    $("msg").className = isError ? "error" : "hint center";
    $("msg").hidden = !text;
  }

  function markDirty() {
    if (!state.dirty && tg && tg.enableClosingConfirmation) tg.enableClosingConfirmation();
    state.dirty = true;
  }

  function newUuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }

  // ── Números: siempre punto decimal (docs/GUIA_NUEVOS_BOTS.md § 1) ─────────
  function normalizarDecimal(input) {
    const antes = input.value;
    let v = antes.replace(/,/g, ".").replace(/[^\d.]/g, "");
    const punto = v.indexOf(".");
    if (punto !== -1) v = v.slice(0, punto + 1) + v.slice(punto + 1).replace(/\./g, "");
    if (v === antes) return;
    const cursor = Math.max(0, (input.selectionStart ?? v.length) - (antes.length - v.length));
    input.value = v;
    try { input.setSelectionRange(cursor, cursor); } catch { /* algunos navegadores no lo permiten */ }
  }
  function soloDigitos(input) {
    const v = input.value.replace(/\D/g, "");
    if (v !== input.value) input.value = v;
  }
  const parseNum = (text) => {
    const t = String(text || "").trim().replace(/,/g, ".");
    return t === "" ? NaN : Number(t);
  };
  // Punto decimal y miles con espacio (el formato local es-CO muestra coma decimal: no usarlo).
  function fmtNum(n, dec = 0) {
    if (!Number.isFinite(n)) return "—";
    const [ent, frac] = n.toFixed(dec).split(".");
    const miles = ent.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return frac && Number(frac) !== 0 ? `${miles}.${frac}` : miles;
  }
  const pesos = (n) => `$ ${fmtNum(n, 2)}`;
  const totalActual = () => {
    const g = parseNum($("galones").value), p = parseNum($("precio").value);
    return Number.isFinite(g) && Number.isFinite(p) ? Math.round(g * p * 100) / 100 : NaN;
  };

  // Sin respuesta del servidor (sin señal) o el túnel/proxy no llega al bot: se puede reintentar.
  const SIN_RED = [502, 503, 504];

  async function api(path, options = {}) {
    let res;
    try {
      res = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg ? tg.initData : "", ...(options.headers || {}) },
      });
    } catch (_) {
      const err = new Error("Sin conexión");
      err.network = true;
      throw err;
    }
    if (SIN_RED.includes(res.status)) {
      const err = new Error(`Error ${res.status}`);
      err.status = res.status;
      err.network = true;
      throw err;
    }
    let body = null;
    try { body = await res.json(); } catch (_) { /* sin JSON */ }
    if (!res.ok) {
      let detail = body && body.detail;
      if (Array.isArray(detail)) detail = detail.map((d) => String(d.msg).replace(/^Value error, /, "")).join("\n");
      const err = new Error(detail || `Error ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return body;
  }

  // ── Bandeja de salida (formularios guardados sin señal) ─────────────────
  // Regla de todos los formularios (docs/GUIA_NUEVOS_BOTS.md § 5): sin señal, el registro (con
  // su factura) se guarda en el teléfono y se reenvía solo al volver la red, como máximo 1 hora
  // después de perderla. Pasada la hora el servidor lo guarda solo como auditoría (410).
  const VENTANA_MS = 60 * 60 * 1000;
  const REINTENTO_MS = 15 * 1000;
  const BANDEJA_MAX_MS = 7 * 24 * 60 * 60 * 1000;
  const IDB_NAME = "combustible-offline", IDB_STORE = "bandeja", LS_PREFIX = "combustible-bandeja:";

  function idb() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("sin IndexedDB")); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE, { keyPath: "uuid" });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbRun(mode, fn) {
    const db = await idb();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, mode);
        const req = fn(tx.objectStore(IDB_STORE));
        tx.oncomplete = () => resolve(req && req.result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    } finally { db.close(); }
  }

  const bandeja = {
    async put(item) {
      try { await idbRun("readwrite", (s) => s.put(item)); return true; } catch (_) { /* respaldo */ }
      try { localStorage.setItem(LS_PREFIX + item.uuid, JSON.stringify(item)); return true; } catch (_) { return false; }
    },
    async all() {
      let items = [];
      try { items = (await idbRun("readonly", (s) => s.getAll())) || []; } catch (_) { /* respaldo */ }
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(LS_PREFIX) && !items.some((x) => LS_PREFIX + x.uuid === k)) items.push(JSON.parse(localStorage.getItem(k)));
        }
      } catch (_) { /* sin almacenamiento */ }
      return items;
    },
    async del(uuid) {
      try { await idbRun("readwrite", (s) => s.delete(uuid)); } catch (_) { /* respaldo */ }
      try { localStorage.removeItem(LS_PREFIX + uuid); } catch (_) { /* sin almacenamiento */ }
    },
  };

  const usuarioId = () => (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null);
  const vencidoLocal = (item) => Date.now() - Date.parse(item.sin_senal_desde) > VENTANA_MS;
  const cuerpoDiferido = (item) => JSON.stringify({
    ...item.payload, diferido: { init_data_original: item.init_data_original, sin_senal_desde: item.sin_senal_desde },
  });

  async function vaciarBandeja() {
    const propios = (await bandeja.all()).filter((i) => i && i.user_id === usuarioId())
      .sort((a, b) => Date.parse(a.sin_senal_desde) - Date.parse(b.sin_senal_desde));
    let aceptado = null, aviso = "";
    for (const item of propios) {
      if (Date.now() - Date.parse(item.sin_senal_desde) > BANDEJA_MAX_MS) { await bandeja.del(item.uuid); continue; }
      try {
        aceptado = await api("/api/combustible", { method: "POST", body: cuerpoDiferido(item) });
        await bandeja.del(item.uuid);
      } catch (err) {
        if (err.network || err.status === 401 || (err.status && err.status >= 500)) break;
        await bandeja.del(item.uuid);
        if (err.status !== 410) aviso = `Tu registro de combustible guardado sin señal no fue aceptado: ${err.message}\nDiligencia uno nuevo.`;
      }
    }
    return { aceptado, aviso };
  }

  function detenerReintentos() {
    if (state.reintento) { clearInterval(state.reintento); state.reintento = null; }
    window.removeEventListener("online", reintentarSiPendiente);
  }

  function reintentarSiPendiente() {
    if (!state.pendiente || state.sending || state.finished) return;
    if (vencidoLocal(state.pendiente)) { vencer(); return; }
    submit();
  }

  function modoSinSenal(guardado) {
    $("next").textContent = "Reintentar ahora";
    $("next").disabled = false;
    setMsg(guardado
      ? "📥 Sin señal. Tu registro quedó guardado en este teléfono y se enviará solo cuando vuelva la señal (hasta 1 hora).\n" +
        "Mantén abierto el formulario; si lo cierras, vuelve a abrirlo cuando tengas señal."
      : "📵 Sin señal y no se pudo guardar en el teléfono. No cierres el formulario: se enviará solo cuando vuelva la señal (hasta 1 hora).",
    true);
    if (!state.reintento) {
      state.reintento = setInterval(reintentarSiPendiente, REINTENTO_MS);
      window.addEventListener("online", reintentarSiPendiente);
    }
  }

  function vencer() {
    detenerReintentos();
    state.finished = true;
    if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
    document.querySelectorAll("section[data-step]").forEach((s) => { s.hidden = true; });
    $("stepper").hidden = true;
    $("actions").hidden = true;
    block("No se pudo enviar a tiempo",
      "Pasó más de 1 hora sin señal y este registro ya no se puede enviar.\nDiligencia uno nuevo cuando tengas señal.");
  }

  function confirmAsync(text) {
    return new Promise((resolve) => {
      if (tg && tg.showConfirm) tg.showConfirm(text, (ok) => resolve(Boolean(ok)));
      else resolve(window.confirm(text));
    });
  }

  // ── Pestañas (Combustible / Combustible para gastos) ─────────────────────
  const modalidad = () => state.form.modalidades.find((m) => m.key === state.modalidad);
  const facturaObligatoria = () => state.form.factura_obligatoria_en.includes(state.modalidad);

  function renderTabs() {
    $("tabs").replaceChildren(...state.form.modalidades.map((m) => {
      const b = el("button", { type: "button", "aria-pressed": String(m.key === state.modalidad), text: m.label });
      b.addEventListener("click", () => setModalidad(m.key));
      return b;
    }));
    const oblig = facturaObligatoria();
    $("tab-hint").textContent = oblig
      ? "Pagado por el conductor: la factura en PDF es obligatoria."
      : "Compra con el proveedor de la empresa: la factura es opcional.";
    $("factura-req").hidden = !oblig;
    $("factura-hint").textContent = oblig ? "Obligatoria en «Combustible para gastos»." : "Opcional en «Combustible».";
  }

  function setModalidad(key) {
    state.modalidad = key;
    markDirty();
    renderTabs();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    if (!$("pendientes").hidden) renderPendientes();
  }

  // ── Proveedor: lista de aprobados o texto libre ──────────────────────────
  const norm = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase()
    .replace(/[^0-9A-Z]+/g, " ").trim();

  function renderSugerencias() {
    const q = $("buscar").value.trim();
    const nq = norm(q);
    const lista = state.form.proveedores.filter((p) => !nq || norm(p.nombre).includes(nq)).slice(0, MAX_SUGERENCIAS);
    const nodos = lista.map((p) => {
      const b = el("button", { type: "button", text: p.nombre });
      b.addEventListener("click", () => setProveedor({ id: p.id, nombre: p.nombre }));
      return b;
    });
    const exacto = state.form.proveedores.some((p) => norm(p.nombre) === nq);
    if (q && !exacto) {
      const b = el("button", { type: "button", class: "libre", text: `✎ Usar «${q}» (no está en la lista)` });
      b.addEventListener("click", () => setProveedor({ id: null, nombre: q }));
      nodos.push(b);
    }
    if (!q && state.form.proveedores.length === 0) {
      nodos.push(el("div", { class: "hint", text: "No hay proveedores aprobados cargados: escribe el nombre del proveedor." }));
    }
    $("sugerencias").replaceChildren(...nodos);
  }

  function setProveedor(p) {
    state.proveedor = p;
    markDirty();
    $("buscador").hidden = Boolean(p);
    $("elegido").hidden = !p;
    if (p) {
      $("elegido-nombre").replaceChildren(p.nombre,
        el("span", { class: "tag", text: p.id ? "Proveedor aprobado" : "Escrito a mano (no está en la lista)" }));
    } else {
      $("buscar").value = "";
      renderSugerencias();
      $("buscar").focus();
    }
    if (!$("pendientes").hidden) renderPendientes();
  }

  // ── Factura PDF ──────────────────────────────────────────────────────────
  function leerDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error("No se pudo leer el archivo."));
      r.readAsDataURL(file);
    });
  }

  async function esPdf(file) {
    const cabecera = new Uint8Array(await file.slice(0, 5).arrayBuffer());
    return String.fromCharCode(...cabecera) === "%PDF-";
  }

  async function onPdf(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    try {
      if (!(await esPdf(file))) { setMsg("La factura debe ser un documento PDF.", true); return; }
      if (file.size > PDF_MAX) { setMsg(`La factura pesa ${fmtNum(file.size / 1048576, 1)} MB; el máximo es 4 MB.`, true); return; }
      state.factura = { nombre: file.name || "factura.pdf", tamano: file.size, data: await leerDataUrl(file) };
    } catch (err) {
      setMsg(err.message, true);
      return;
    }
    markDirty();
    setMsg("");
    renderFactura();
  }

  function renderFactura() {
    const f = state.factura;
    $("pdf-zone").hidden = Boolean(f);
    $("pdf-ok").hidden = !f;
    if (f) $("pdf-nombre").textContent = `${f.nombre} (${fmtNum(f.tamano / 1024, 0)} KB)`;
    if (!$("pendientes").hidden) renderPendientes();
  }

  // ── Pendientes (cada uno lleva a su campo) ───────────────────────────────
  function kmMinimo() { return state.ctx.ultimo_km; }

  function pendientes() {
    const out = [];
    const add = (id, text) => out.push({ id, text });
    if (!state.proveedor) add("w-proveedor", "Proveedor");
    const fecha = $("fecha").value;
    if (!fecha) add("w-fecha", "Fecha de la transacción");
    else if (fecha > $("fecha").max || fecha < $("fecha").min) add("w-fecha", "Fecha de la transacción (fuera del rango permitido)");
    const g = parseNum($("galones").value), p = parseNum($("precio").value), km = parseNum($("km").value);
    if (!(g > 0)) add("w-galones", "Galones (mayor que 0)");
    if (!(p > 0)) add("w-precio", "Precio por galón (mayor que 0)");
    if (!$("tipo").value) add("w-tipo", "Tipo de combustible");
    if (!Number.isFinite(km)) add("w-km", "Kilometraje al tanqueo");
    else if (kmMinimo() != null && km < kmMinimo()) add("w-km", `Kilometraje: debe ser mayor o igual a ${fmtNum(kmMinimo())} km`);
    if (facturaObligatoria() && !state.factura) add("w-factura", "Factura en PDF (obligatoria en «Combustible para gastos»)");
    return out;
  }

  function renderPendientes(show = true) {
    const faltan = pendientes();
    const ids = new Set(faltan.map((f) => f.id));
    document.querySelectorAll(".field-wrap").forEach((w) => w.classList.toggle("missing", show && ids.has(w.id)));
    $("pdf-zone").classList.toggle("missing", show && ids.has("w-factura"));
    const box = $("pendientes");
    box.hidden = !show || faltan.length === 0;
    if (box.hidden) return;
    box.replaceChildren(el("div", {}, [
      el("strong", { text: `Falta completar (${faltan.length}):` }),
      el("ul", {}, faltan.map((f) => {
        const b = el("button", { type: "button", class: "jump", text: f.text });
        b.addEventListener("click", () => jump(f.id));
        return el("li", {}, [b]);
      })),
    ]));
  }

  function jump(id) {
    if (state.step !== 1) goTo(1);
    const w = $(id);
    w.scrollIntoView({ behavior: "smooth", block: "center" });
    w.classList.remove("flash"); void w.offsetWidth; w.classList.add("flash");
  }

  // ── Resumen ──────────────────────────────────────────────────────────────
  function filas(id, rows) {
    $(id).replaceChildren(...rows.flatMap(([k, val]) => [el("dt", { text: k }), el("dd", { text: val })]));
  }

  function renderSummary() {
    const v = state.ctx.vehiculo;
    const tipo = state.form.tipos.find((t) => t.value === $("tipo").value);
    const [a, m, d] = $("fecha").value.split("-");
    filas("sum-general", [
      ["Comprador", state.ctx.empleado.nombre],
      ["Contrato", state.ctx.contrato || "—"],
      ["Vehículo", v.placa + (v.numero_interno ? ` · N.º ${v.numero_interno}` : "")],
    ]);
    filas("sum-compra", [
      ["Tipo", modalidad().label],
      ["Proveedor", state.proveedor.nombre + (state.proveedor.id ? "" : " (escrito a mano)")],
      ["Fecha", `${d}/${m}/${a}`],
      ["Combustible", tipo ? tipo.label : "—"],
      ["Galones", fmtNum(parseNum($("galones").value), 3)],
      ["Precio por galón", pesos(parseNum($("precio").value))],
      ["Total", pesos(totalActual())],
      ["Kilometraje", `${fmtNum(parseNum($("km").value))} km`],
      ["Ref. factura", $("ref").value.trim() || "—"],
      ["Factura PDF", state.factura ? state.factura.nombre : "Sin adjunto"],
    ]);
  }

  // ── Navegación ───────────────────────────────────────────────────────────
  function goTo(n) {
    state.step = n;
    document.querySelectorAll("section[data-step]").forEach((s) => { s.hidden = Number(s.dataset.step) !== n; });
    document.querySelectorAll(".step").forEach((s) => {
      const k = Number(s.dataset.n);
      s.classList.toggle("active", k === n);
      s.classList.toggle("done", k < n);
    });
    $("bar").style.width = `${((n - 1) / (STEPS - 1)) * 50}%`;
    $("prev").hidden = n === 1;
    $("next").textContent = n === STEPS ? "Enviar registro" : "Revisar →";
    $("next").classList.toggle("finish", n === STEPS);
    $("next").disabled = state.sending;
    if (tg && tg.BackButton) { if (n > 1) tg.BackButton.show(); else tg.BackButton.hide(); }
    if (n === STEPS) renderSummary();
    renderPendientes(false);
    setMsg("");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function next() {
    if (state.finished) { tg.close(); return; }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (state.step < STEPS) {
      if (pendientes().length) {
        renderPendientes(true);
        $("pendientes").scrollIntoView({ behavior: "smooth", block: "center" });
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return;
      }
      goTo(state.step + 1);
      return;
    }
    if (!(await confirmAsync(`¿Confirmas el registro de ${pesos(totalActual())} en combustible?`))) return;
    await submit();
  }

  function prev() {
    if (state.finished) return;
    if (state.step > 1) goTo(state.step - 1);
  }

  // ── Envío ────────────────────────────────────────────────────────────────
  async function submit() {
    if (state.sending) return;
    state.sending = true;
    $("next").disabled = true;
    $("next").textContent = "Enviando…";
    const payload = state.pendiente ? state.pendiente.payload : {
      uuid: state.uuid,
      vehiculo_id: state.ctx.vehiculo.id,
      para_gastos: modalidad().para_gastos,
      proveedor_id: state.proveedor.id,
      proveedor_texto: state.proveedor.id ? null : state.proveedor.nombre,
      fecha_transaccion: $("fecha").value,
      galones: parseNum($("galones").value),
      precio_galon: parseNum($("precio").value),
      tipo_combustible: $("tipo").value,
      kilometraje: parseNum($("km").value),
      ref_factura: $("ref").value.trim() || null,
      factura: state.factura ? state.factura.data : null,
      factura_nombre: state.factura ? state.factura.nombre : null,
    };
    try {
      const body = state.pendiente ? cuerpoDiferido(state.pendiente) : JSON.stringify(payload);
      const out = await api("/api/combustible", { method: "POST", body });
      if (state.pendiente) { detenerReintentos(); await bandeja.del(state.uuid); }
      showDone(out, Boolean(state.pendiente));
    } catch (err) {
      state.sending = false;
      if (err.network) {
        if (!state.pendiente) {
          state.pendiente = {
            uuid: state.uuid, user_id: usuarioId(), payload,
            init_data_original: state.initDataOriginal, sin_senal_desde: new Date().toISOString(),
          };
          state.pendienteGuardado = await bandeja.put(state.pendiente);
        }
        if (vencidoLocal(state.pendiente)) vencer(); else modoSinSenal(state.pendienteGuardado);
        return;
      }
      if (err.status === 410) { await bandeja.del(state.uuid); vencer(); return; }
      detenerReintentos();
      const sesion = err.status === 401 ? "\nCierra y vuelve a abrir el formulario: lo que guardaste se enviará al abrirlo." : "";
      setMsg(`No se pudo enviar: ${err.message}${sesion}\nPuedes corregir y reintentar: no se duplicará.`, true);
      $("next").textContent = "Reintentar envío";
      $("next").disabled = false;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    }
  }

  function showDone(out, diferido = false) {
    state.finished = true;
    if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
    if (tg && tg.BackButton) tg.BackButton.hide();
    document.querySelectorAll("section[data-step]").forEach((s) => { s.hidden = true; });
    $("stepper").hidden = true;
    $("pendientes").hidden = true;
    $("actions").hidden = false;
    $("prev").hidden = true;
    $("next").textContent = "Cerrar";
    $("next").classList.remove("finish");
    $("next").disabled = false;
    setMsg("");
    $("done").hidden = false;
    $("done-title").textContent = out.duplicado ? "Este registro ya había sido recibido"
      : diferido ? "Combustible recibido al recuperar la señal" : "Combustible recibido";
    $("done-text").textContent = `Total ${pesos(out.total)}.\nSe está registrando en Odoo y te llegará la confirmación en el chat.`;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  }

  function block(title, text, aviso = false) {
    $("blocked").hidden = false;
    $("blocked").classList.toggle("warn", aviso);
    $("blocked-icon").textContent = aviso ? "⚠️" : "🚫";
    $("blocked-title").textContent = title;
    $("blocked-text").textContent = text;
    setMsg("");
  }

  // ── Arranque ─────────────────────────────────────────────────────────────
  function isoMenosDias(iso, dias) {
    const d = new Date(`${iso}T12:00:00Z`);
    d.setUTCDate(d.getUTCDate() - dias);
    return d.toISOString().slice(0, 10);
  }

  async function init() {
    if (!tg || !tg.initData) {
      block("Abre el formulario desde Telegram", "Usa el botón «📋 Formularios» del bot y elige «⛽ Combustible».");
      return;
    }
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor("#ffffff"); } catch (_) { /* versión antigua */ } }
    // Antes de vaciar la bandeja: si se acepta un registro guardado, el botón "Cerrar" debe funcionar.
    $("next").addEventListener("click", next);
    $("prev").addEventListener("click", prev);
    if (tg.BackButton) tg.BackButton.onClick(prev);
    try {
      const [form, ctx] = await Promise.all([api("/api/combustible/form"), api("/api/combustible/context")]);
      state.form = form;
      state.ctx = ctx;
      const previo = await vaciarBandeja();
      if (previo.aceptado) { showDone(previo.aceptado, true); return; }
      state.avisoBandeja = previo.aviso;
    } catch (err) {
      if (err.status === 403) block("Usuario no registrado", `${err.message}.\nPide a Recursos Humanos que lo registre.`);
      else block("No se pudo cargar el formulario", `${err.message}\nVerifica tu señal y vuelve a abrirlo.`);
      return;
    }
    if (!state.ctx.vehiculo) {
      block("Primero el Preoperacional",
        "No tienes un vehículo reservado.\nDiligencia primero el «✅ Preoperacional» del vehículo y luego vuelve a abrir el registro de combustible.\n" +
        "Si ya lo hiciste, revisa que no hayas tocado «🔴 Finalizar».", true);
      return;
    }
    state.uuid = newUuid();
    state.initDataOriginal = tg.initData;
    const v = state.ctx.vehiculo;
    $("comprador").value = state.ctx.empleado.nombre;
    $("contrato").value = state.ctx.contrato || "—";
    $("vehiculo").value = [v.placa, v.numero_interno && `N.º interno ${v.numero_interno}`].filter(Boolean).join(" · ");
    $("fecha").max = state.ctx.hoy;
    $("fecha").min = isoMenosDias(state.ctx.hoy, state.form.dias_atras_max);
    $("fecha").value = state.ctx.hoy;
    $("tipo").replaceChildren(...state.form.tipos.map((t) => el("option", { value: t.value, text: t.label })));
    $("tipo").value = state.form.tipo_por_defecto;
    const km = state.ctx.ultimo_km;
    $("km").placeholder = km != null ? `Último registrado: ${fmtNum(km)} km` : "Kilometraje actual";
    $("km-hint").textContent = km != null ? `Debe ser mayor o igual a ${fmtNum(km)} km (último registrado).` : "";
    renderTabs();
    renderSugerencias();
    renderFactura();

    $("buscar").addEventListener("input", () => { markDirty(); renderSugerencias(); });
    $("cambiar-proveedor").addEventListener("click", () => setProveedor(null));
    for (const id of ["galones", "precio"]) {
      $(id).addEventListener("input", () => { normalizarDecimal($(id)); markDirty(); $("total").textContent = pesos(totalActual() || 0); });
    }
    $("km").addEventListener("input", () => { soloDigitos($("km")); markDirty(); });
    for (const id of ["fecha", "tipo", "ref"]) $(id).addEventListener("input", markDirty);
    document.querySelectorAll("#w-galones input, #w-precio input, #km, #fecha, #tipo").forEach((i) => {
      i.addEventListener("input", () => { if (!$("pendientes").hidden) renderPendientes(); });
    });
    $("elegir-pdf").addEventListener("click", () => $("pdf-input").click());
    $("pdf-input").addEventListener("change", onPdf);
    $("quitar-pdf").addEventListener("click", () => { state.factura = null; markDirty(); renderFactura(); });

    $("stepper").hidden = false;
    $("actions").hidden = false;
    goTo(1);
    if (state.avisoBandeja) setMsg(state.avisoBandeja, true);
  }

  init();
})();
</script>
</body>
</html>
